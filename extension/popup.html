<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllDown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #ffffff;
      width: 320px;
      min-height: 400px;
    }

    .dark body {
      color: #f1f5f9;
      background: #0f172a;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .dark .header {
      border-bottom-color: #334155;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .title h1 {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    .title p {
      font-size: 11px;
      color: #64748b;
    }

    .dark .title p {
      color: #94a3b8;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
    }

    .dark .status {
      border-bottom-color: #334155;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .status-indicator.disconnected {
      background: #ef4444;
    }

    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: #0ea5e9;
      color: white;
    }

    .btn-primary:hover {
      background: #0284c7;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }

    .dark .btn-secondary {
      background: #1e293b;
      color: #f1f5f9;
      border-color: #334155;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .dark .btn-secondary:hover {
      background: #334155;
    }

    .btn-icon {
      width: 18px;
      height: 18px;
    }

    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 8px 16px;
    }

    .dark .divider {
      background: #334155;
    }

    .section-title {
      padding: 0 16px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }

    .dark .section-title {
      color: #94a3b8;
    }

    .media-list {
      padding: 0 12px 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .media-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #f8fafc;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .dark .media-item {
      background: #1e293b;
    }

    .media-item:hover {
      background: #f1f5f9;
    }

    .dark .media-item:hover {
      background: #334155;
    }

    .media-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .media-icon.video { background: #fce7f3; color: #ec4899; }
    .dark .media-icon.video { background: #831843; color: #f9a8d4; }

    .media-icon.audio { background: #f3e8ff; color: #8b5cf6; }
    .dark .media-icon.audio { background: #581c87; color: #d8b4fe; }

    .media-icon.image { background: #dcfce7; color: #16a34a; }
    .dark .media-icon.image { background: #14532d; color: #86efac; }

    .media-info {
      flex: 1;
      min-width: 0;
    }

    .media-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-meta {
      display: flex;
      gap: 8px;
      margin-top: 2px;
      font-size: 10px;
      color: #64748b;
    }

    .dark .media-meta {
      color: #94a3b8;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #94a3b8;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dark .footer {
      border-top-color: #334155;
    }

    .footer-link {
      font-size: 11px;
      color: #0ea5e9;
      text-decoration: none;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    .version {
      font-size: 10px;
      color: #94a3b8;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #64748b;
      font-size: 12px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #e2e8f0;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    .dark .spinner {
      border-color: #334155;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">AD</div>
    <div class="title">
      <h1>AllDown</h1>
      <p>Download Manager Integration</p>
    </div>
  </div>

  <div class="status">
    <div class="status-indicator" id="statusIndicator"></div>
    <span id="statusText">Connecting...</span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="sniffBtn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      Sniff Media on This Page
    </button>

    <button class="btn btn-secondary" id="downloadAllBtn" disabled>
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download All Media
    </button>

    <button class="btn btn-secondary" id="openAppBtn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
        <path d="M8 21h8"></path>
        <path d="M12 17v4"></path>
      </svg>
      Open AllDown App
    </button>
  </div>

  <div class="divider"></div>

  <div class="section-title">Detected Media</div>
  <div class="media-list" id="mediaList">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <p>Click "Sniff Media" to find downloadable content</p>
    </div>
  </div>

  <div class="divider"></div>

  <div class="footer">
    <a href="https://github.com/alldown/alldown" class="footer-link" target="_blank">Help & Docs</a>
    <span class="version">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
